name: Discovery (robots-allowed, nightly)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Discovery (robots-allowed) job
        run: npm run job -- --type DISCOVERY_ROBOTS_ALLOWED
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
