name: Harvest product URLs from sitemaps — weekly

on:
  schedule:
    # Sundays at 04:00 UTC (after DSLD image OCR runs at 01:00)
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      maxDomains:
        description: "Max official domains to scan"
        required: false
        default: "50"
      maxUrlsPerDomain:
        description: "Max product URLs to ingest per domain"
        required: false
        default: "200"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sitemap harvest
        run: npm run discover:sitemaps -- --maxDomains ${{ github.event.inputs.maxDomains || '50' }} --maxUrlsPerDomain ${{ github.event.inputs.maxUrlsPerDomain || '200' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
